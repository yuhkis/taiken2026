<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おみくじ</title>
<style>
body{font-family:sans-serif;text-align:center;background:#fff8e1;margin:0;padding:24px}
h1{font-size:24px}
#res{font-size:52px;font-weight:bold;margin:20px 0 8px;color:#e65100;min-height:64px}
#msg{font-size:20px;margin-bottom:24px;min-height:60px;line-height:1.6}
#go{font-size:22px;padding:14px 34px;border:none;border-radius:12px;background:#e65100;color:#fff;font-weight:bold}
#go:active{background:#bf360c}
</style></head><body>
<h1>🥠 今日のおみくじ</h1>
<div id="res">？</div>
<div id="msg">ボタンをおしてね</div>
<button id="go">おみくじをひく</button>
<script>
var list=[
 ['大吉 🎉','今日はなにをやってもうまくいく日！ 思いきって挑戦しよう'],
 ['中吉 😊','いい流れです。あせらず一つずつ進めば結果がついてくる'],
 ['小吉 🍀','小さないいことがある日。まわりの人にやさしくしてみよう'],
 ['吉 ✨','ふつうにいい日。いつもどおりが一番つよい'],
 ['末吉 🌱','これから良くなる日。あきらめないで続けてみよう'],
 ['凶 ☔','うまくいかない日もある。休むのも作戦のうち']
];
document.getElementById('go').addEventListener('click',function(){
  var p=list[Math.floor(Math.random()*list.length)];
  document.getElementById('res').textContent=p[0];
  document.getElementById('msg').textContent=p[1];
});
</script></body></html>
